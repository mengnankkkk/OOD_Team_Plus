name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOPPLER_PROJECT: money-whisperer
  DOPPLER_CONFIG: prd
  DEPLOY_BRANCH: main

jobs:
  deploy:
    name: SSH Build And Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install deployment tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates openssh-client sshpass
          curl -Ls --tlsv1.2 --proto '=https' https://cli.doppler.com/install.sh | sudo sh

      - name: Check release freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          LATEST_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "[deploy] Marking stale queued commit $GITHUB_SHA; current main is $LATEST_SHA."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load deployment secrets
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail

          : "${DOPPLER_TOKEN:?DOPPLER_TOKEN GitHub secret is required}"

          doppler_secret() {
            doppler secrets get "$1" \
              --project "$DOPPLER_PROJECT" \
              --config "$DOPPLER_CONFIG" \
              --plain
          }

          DEPLOY_HOST="$(doppler_secret DEPLOY_HOST)"
          DEPLOY_PORT="$(doppler_secret DEPLOY_PORT)"
          DEPLOY_USER="$(doppler_secret DEPLOY_USER)"
          DEPLOY_PASSWORD="$(doppler_secret DEPLOY_PASSWORD)"
          DEPLOY_PATH="$(doppler_secret DEPLOY_PATH)"
          APP_ORIGIN="$(doppler_secret APP_ORIGIN)"

          echo "::add-mask::$DOPPLER_TOKEN"
          echo "::add-mask::$DEPLOY_PASSWORD"

          {
            echo "DEPLOY_HOST=$DEPLOY_HOST"
            echo "DEPLOY_PORT=$DEPLOY_PORT"
            echo "DEPLOY_USER=$DEPLOY_USER"
            echo "DEPLOY_PASSWORD=$DEPLOY_PASSWORD"
            echo "DEPLOY_PATH=$DEPLOY_PATH"
            echo "APP_ORIGIN=$APP_ORIGIN"
          } >> "$GITHUB_ENV"

      - name: Package source
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="$RUNNER_TEMP/money-whisperer-source.tgz"
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./.next-e2e' \
            --exclude='./.next-visual' \
            --exclude='./coverage' \
            --exclude='./playwright-report' \
            --exclude='./test-results' \
            -czf "$SOURCE_ARCHIVE" .
          SOURCE_ARCHIVE_SHA256="$(sha256sum "$SOURCE_ARCHIVE" | cut -d ' ' -f 1)"
          SOURCE_REMOTE_PATH="/tmp/money-whisperer-source-$GITHUB_SHA.tgz"
          echo "SOURCE_ARCHIVE=$SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          echo "SOURCE_ARCHIVE_SHA256=$SOURCE_ARCHIVE_SHA256" >> "$GITHUB_ENV"
          echo "SOURCE_REMOTE_PATH=$SOURCE_REMOTE_PATH" >> "$GITHUB_ENV"
          echo "[deploy] Packaged source archive: $(stat -c '%s bytes' "$SOURCE_ARCHIVE")"

      - name: Upload deployment assets
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e scp -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$(command -v doppler)" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/doppler"
          sshpass -e scp -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$SOURCE_ARCHIVE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$SOURCE_REMOTE_PATH"

      - name: Verify uploaded source
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEPLOY_PASSWORD"
          REMOTE_SOURCE_SHA256="$(
            sshpass -e ssh \
              -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=40 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "sha256sum '$SOURCE_REMOTE_PATH' | cut -d ' ' -f 1"
          )"

          if [ "$REMOTE_SOURCE_SHA256" != "$SOURCE_ARCHIVE_SHA256" ]; then
            echo "Uploaded source archive checksum mismatch." >&2
            exit 1
          fi

          echo "[deploy] Source archive upload verified by SHA-256."

      - name: Prepare server
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          A2A_BOOTSTRAP_CLIENT_TOKEN: ${{ secrets.A2A_BOOTSTRAP_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          : "${A2A_BOOTSTRAP_CLIENT_TOKEN:?A2A_BOOTSTRAP_CLIENT_TOKEN GitHub secret is required}"
          echo "::add-mask::$A2A_BOOTSTRAP_CLIENT_TOKEN"

          quote() {
            printf '%q' "$1"
          }

          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DOPPLER_TOKEN=$(quote "$DOPPLER_TOKEN") bash -s" <<'REMOTE'
          set -euo pipefail

          : "${DOPPLER_TOKEN:?}"
          export DOPPLER_TOKEN
          export DEBIAN_FRONTEND=noninteractive

          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          fi

          install_packages() {
            if command -v apt-get >/dev/null 2>&1; then
              . /etc/os-release
              for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
                [ -f "$source_file" ] || continue
                case "${ID:-}" in
                  debian)
                    $SUDO sed -i \
                      -e 's|http://deb.debian.org/debian-security|http://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
                      -e 's|https://deb.debian.org/debian-security|http://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
                      -e 's|http://security.debian.org/debian-security|http://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
                      -e 's|https://security.debian.org/debian-security|http://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
                      -e 's|http://deb.debian.org/debian|http://mirrors.tuna.tsinghua.edu.cn/debian|g' \
                      -e 's|https://deb.debian.org/debian|http://mirrors.tuna.tsinghua.edu.cn/debian|g' \
                      "$source_file"
                    ;;
                  ubuntu)
                    $SUDO sed -i \
                      -e 's|http://archive.ubuntu.com/ubuntu|http://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                      -e 's|https://archive.ubuntu.com/ubuntu|http://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                      -e 's|http://security.ubuntu.com/ubuntu|http://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                      -e 's|https://security.ubuntu.com/ubuntu|http://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                      -e 's|http://ports.ubuntu.com/ubuntu-ports|http://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports|g' \
                      -e 's|https://ports.ubuntu.com/ubuntu-ports|http://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports|g' \
                      "$source_file"
                    ;;
                esac
              done
              $SUDO apt-get update
              $SUDO apt-get install -y ca-certificates
              for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
                [ -f "$source_file" ] || continue
                $SUDO sed -i \
                  's|http://mirrors.tuna.tsinghua.edu.cn|https://mirrors.tuna.tsinghua.edu.cn|g' \
                  "$source_file"
              done
              $SUDO apt-get update
              $SUDO apt-get install -y git curl util-linux coreutils docker.io docker-compose-plugin
            elif command -v dnf >/dev/null 2>&1; then
              $SUDO dnf install -y git curl ca-certificates util-linux coreutils docker docker-compose-plugin
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y git curl ca-certificates util-linux coreutils docker docker-compose-plugin
            else
              echo "Unsupported server OS: apt-get, dnf, or yum is required." >&2
              exit 1
            fi
          }

          echo "::group::Install server packages"
          if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v flock >/dev/null 2>&1 || ! command -v timeout >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            install_packages
          fi

          if command -v systemctl >/dev/null 2>&1; then
            $SUDO systemctl enable --now docker
          else
            $SUDO service docker start || true
          fi
          echo "::endgroup::"

          echo "::group::Install Doppler CLI"
          if ! command -v doppler >/dev/null 2>&1; then
            if [ -s /tmp/doppler ]; then
              $SUDO install -m 0755 /tmp/doppler /usr/local/bin/doppler
            fi
            if ! command -v doppler >/dev/null 2>&1 || ! doppler --version >/dev/null 2>&1; then
              curl --fail --location --show-error --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 180 \
                --tlsv1.2 --proto '=https' https://cli.doppler.com/install.sh | $SUDO sh
            fi
          fi
          doppler --version
          echo "::endgroup::"
          REMOTE

      - name: Build and restart containers
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          A2A_BOOTSTRAP_CLIENT_TOKEN: ${{ secrets.A2A_BOOTSTRAP_CLIENT_TOKEN }}
        run: |
          set -euo pipefail

          quote() {
            printf '%q' "$1"
          }

          REMOTE_ENV="DOPPLER_TOKEN=$(quote "$DOPPLER_TOKEN") A2A_BOOTSTRAP_CLIENT_TOKEN=$(quote "$A2A_BOOTSTRAP_CLIENT_TOKEN") DEPLOY_PATH=$(quote "$DEPLOY_PATH") SOURCE_REMOTE_PATH=$(quote "$SOURCE_REMOTE_PATH") DEPLOY_BRANCH=$(quote "$DEPLOY_BRANCH") GITHUB_REPOSITORY=$(quote "$GITHUB_REPOSITORY") GITHUB_SHA=$(quote "$GITHUB_SHA") DOPPLER_PROJECT=$(quote "$DOPPLER_PROJECT") DOPPLER_CONFIG=$(quote "$DOPPLER_CONFIG")"

          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_ENV bash -s" <<'REMOTE'
          set -euo pipefail

          : "${DOPPLER_TOKEN:?}"
          : "${A2A_BOOTSTRAP_CLIENT_TOKEN:?}"
          : "${DEPLOY_PATH:?}"
          : "${GITHUB_SHA:?}"
          : "${DOPPLER_PROJECT:?}"
          : "${DOPPLER_CONFIG:?}"
          : "${SOURCE_REMOTE_PATH:?}"

          export DOPPLER_TOKEN
          export A2A_BOOTSTRAP_CLIENT_TOKEN
          export GIT_SHA="$GITHUB_SHA"

          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          fi

          $SUDO mkdir -p "$DEPLOY_PATH"
          exec 9>"$DEPLOY_PATH/.deploy.lock"
          if ! flock -n 9; then
            echo "[deploy] Another production deployment is active; refusing concurrent build." >&2
            exit 75
          fi

          echo "::group::Unpack release"
          RELEASE_DIR="$DEPLOY_PATH/releases/$GITHUB_SHA"
          $SUDO rm -rf "$RELEASE_DIR"
          $SUDO mkdir -p "$RELEASE_DIR"
          $SUDO tar -xzf "$SOURCE_REMOTE_PATH" -C "$RELEASE_DIR"
          $SUDO rm -f "$SOURCE_REMOTE_PATH"
          cd "$RELEASE_DIR"
          echo "::endgroup::"

          echo "[deploy] Starting Docker image build at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          build_heartbeat() {
            while sleep 20; do
              echo "[deploy] Docker image build is still running at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          }

          build_heartbeat &
          HEARTBEAT_PID=$!
          stop_heartbeat() {
            kill "$HEARTBEAT_PID" >/dev/null 2>&1 || true
            wait "$HEARTBEAT_PID" >/dev/null 2>&1 || true
          }
          trap stop_heartbeat EXIT

          timeout --signal=TERM --kill-after=60s 20m doppler run \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            -- env BUILDKIT_PROGRESS=plain COMPOSE_PROGRESS=plain \
              stdbuf -oL -eL docker compose -p money-whisperer build money-whisperer

          stop_heartbeat
          trap - EXIT
          echo "[deploy] Docker image build completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "::group::Validate runtime secrets"
          timeout --signal=TERM --kill-after=15s 2m doppler run \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            -- docker compose -p money-whisperer run --rm --no-deps -T money-whisperer \
              node -e 'if (!process.env.A2A_BEARER_TOKEN?.trim() || !process.env.A2A_BOOTSTRAP_CLIENT_TOKEN?.trim()) { console.error("Required A2A runtime secrets are missing from the container environment."); process.exit(1); }' \
            </dev/null
          echo "[deploy] Required A2A runtime secrets are available in the container."
          echo "::endgroup::"

          $SUDO ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"

          echo "::group::Restart containers"
          timeout --signal=TERM --kill-after=60s 5m doppler run \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            -- docker compose -p money-whisperer up -d --no-build --remove-orphans --wait --wait-timeout 180

          $SUDO docker compose -p money-whisperer exec -T money-whisperer \
            node -e 'fetch("http://127.0.0.1:3000/api/a2a/message-send", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }).then((response) => { if (response.status !== 401) { console.error(`A2A runtime auth probe returned HTTP ${response.status}; expected 401.`); process.exitCode = 1; } }).catch((error) => { console.error(error); process.exitCode = 1; })' \
            </dev/null
          echo "[deploy] A2A runtime auth probe returned the expected HTTP 401."
          echo "::endgroup::"

          echo "::group::Deployment status"
          $SUDO docker image prune -f
          $SUDO docker compose -p money-whisperer ps
          timeout --signal=TERM --kill-after=15s 2m $SUDO docker builder prune --force --filter until=168h || echo "[deploy] BuildKit cache cleanup skipped after timeout."
          echo "::endgroup::"
          REMOTE

      - name: Verify public A2A gateway
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        env:
          A2A_BOOTSTRAP_CLIENT_TOKEN: ${{ secrets.A2A_BOOTSTRAP_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          : "${A2A_BOOTSTRAP_CLIENT_TOKEN:?}"
          echo "::add-mask::$A2A_BOOTSTRAP_CLIENT_TOKEN"
          BASE_URL="${APP_ORIGIN%%,*}"
          BASE_URL="${BASE_URL%/}"
          CARD="$(curl --fail --silent --show-error "$BASE_URL/.well-known/agent-card.json")"
          jq -e '
            [.skills[].id] == [
              "chief_advisor_conversation",
              "debate_mode",
              "scenario_simulation",
              "research_search"
            ]
            and ([.supportedInterfaces[].protocolBinding] | index("JSONRPC") != null)
            and ([.supportedInterfaces[].protocolBinding] | index("HTTP+JSON") != null)
          ' <<<"$CARD" >/dev/null
          STATUS="$(curl --silent --output /tmp/a2a-tasks.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $A2A_BOOTSTRAP_CLIENT_TOKEN" \
            "$BASE_URL/api/a2a/tasks?limit=1")"
          test "$STATUS" = "200"
          jq -e '.items | type == "array"' /tmp/a2a-tasks.json >/dev/null
          ADVISOR_BODY="$(jq -nc --arg messageId "deploy-advisor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '{
            message: {
              role: "ROLE_USER",
              messageId: $messageId,
              parts: [{ text: "Verify the external A2A Chief Advisor initial response path." }],
              metadata: {
                capabilityId: "chief_advisor_conversation",
                operation: "send"
              }
            }
          }')"
          ADVISOR_TIME="$(curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 8 \
            --output /tmp/a2a-advisor.json \
            --write-out '%{time_total}' \
            -H "Authorization: Bearer $A2A_BOOTSTRAP_CLIENT_TOKEN" \
            -H "content-type: application/json" \
            -d "$ADVISOR_BODY" \
            "$BASE_URL/api/a2a/message:send")"
          jq -e '
            (keys == ["task"])
            and (.task.status.state as $state
              | ["TASK_STATE_SUBMITTED", "TASK_STATE_WORKING", "TASK_STATE_COMPLETED", "TASK_STATE_INPUT_REQUIRED"]
              | index($state) != null)
          ' /tmp/a2a-advisor.json >/dev/null
          echo "[deploy] Chief Advisor initial A2A response completed in ${ADVISOR_TIME}s."
          STREAM_BODY="$(jq -nc --arg messageId "deploy-stream-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '{
            message: {
              role: "ROLE_USER",
              messageId: $messageId,
              parts: [{ text: "Verify the external A2A streaming path." }],
              metadata: {
                capabilityId: "research_search",
                operation: "start",
                input: {
                  query: "A2A streaming capability",
                  adapters: ["KNOWLEDGE_BASE"],
                  maximumResults: 1
                }
              }
            }
          }')"
          STREAM_STATUS=0
          curl --fail --silent --show-error --no-buffer \
            --connect-timeout 5 \
            --max-time 8 \
            --dump-header /tmp/a2a-stream.headers \
            --output /tmp/a2a-stream.body \
            -H "Authorization: Bearer $A2A_BOOTSTRAP_CLIENT_TOKEN" \
            -H "content-type: application/a2a+json" \
            -d "$STREAM_BODY" \
            "$BASE_URL/api/a2a/message:stream" || STREAM_STATUS=$?
          test "$STREAM_STATUS" = "0" || test "$STREAM_STATUS" = "28"
          grep -Eiq '^content-type: text/event-stream' /tmp/a2a-stream.headers
          sed -n 's/^data: //p' /tmp/a2a-stream.body | head -n 1 | jq -e 'keys == ["task"]' >/dev/null
          echo "[deploy] HTTP+JSON A2A streaming response verified."
          RESEARCH_BODY="$(jq -nc --arg messageId "deploy-research-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '{
            message: {
              role: "ROLE_USER",
              messageId: $messageId,
              parts: [{ text: "Verify the external A2A knowledge base research path." }],
              metadata: {
                capabilityId: "research_search",
                operation: "start",
                input: {
                  query: "A2A capability gateway",
                  adapters: ["KNOWLEDGE_BASE"],
                  maximumResults: 3
                }
              }
            }
          }')"
          RESEARCH_TASK="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $A2A_BOOTSTRAP_CLIENT_TOKEN" \
            -H "content-type: application/json" \
            -d "$RESEARCH_BODY" \
            "$BASE_URL/api/a2a/message:send")"
          jq -e 'keys == ["task"]' <<<"$RESEARCH_TASK" >/dev/null
          RESEARCH_TASK_ID="$(jq -er '.task.id' <<<"$RESEARCH_TASK")"
          RESEARCH_STATE=""
          for _ in $(seq 1 30); do
            RESEARCH_STATE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $A2A_BOOTSTRAP_CLIENT_TOKEN" \
              "$BASE_URL/api/a2a/tasks/$RESEARCH_TASK_ID" | jq -r '.status.state')"
            case "$RESEARCH_STATE" in
              TASK_STATE_COMPLETED) break ;;
              TASK_STATE_FAILED|TASK_STATE_CANCELED) echo "[deploy] Research smoke test ended in $RESEARCH_STATE." >&2; exit 1 ;;
            esac
            sleep 2
          done
          test "$RESEARCH_STATE" = "TASK_STATE_COMPLETED"
          echo "[deploy] Public Agent Card: $BASE_URL/.well-known/agent-card.json"
          echo "[deploy] Client-specific A2A authentication, task listing, and research execution verified."

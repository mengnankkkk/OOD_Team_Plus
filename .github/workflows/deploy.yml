name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOPPLER_PROJECT: money-whisperer
  DOPPLER_CONFIG: prd
  DEPLOY_BRANCH: main

jobs:
  deploy:
    name: SSH Build And Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install deployment tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates openssh-client sshpass
          curl -Ls --tlsv1.2 --proto '=https' https://cli.doppler.com/install.sh | sudo sh

      - name: Load deployment secrets
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail

          : "${DOPPLER_TOKEN:?DOPPLER_TOKEN GitHub secret is required}"

          doppler_secret() {
            doppler secrets get "$1" \
              --project "$DOPPLER_PROJECT" \
              --config "$DOPPLER_CONFIG" \
              --plain
          }

          DEPLOY_HOST="$(doppler_secret DEPLOY_HOST)"
          DEPLOY_PORT="$(doppler_secret DEPLOY_PORT)"
          DEPLOY_USER="$(doppler_secret DEPLOY_USER)"
          DEPLOY_PASSWORD="$(doppler_secret DEPLOY_PASSWORD)"
          DEPLOY_PATH="$(doppler_secret DEPLOY_PATH)"

          echo "::add-mask::$DOPPLER_TOKEN"
          echo "::add-mask::$DEPLOY_PASSWORD"

          {
            echo "DEPLOY_HOST=$DEPLOY_HOST"
            echo "DEPLOY_PORT=$DEPLOY_PORT"
            echo "DEPLOY_USER=$DEPLOY_USER"
            echo "DEPLOY_PASSWORD=$DEPLOY_PASSWORD"
            echo "DEPLOY_PATH=$DEPLOY_PATH"
          } >> "$GITHUB_ENV"

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="$RUNNER_TEMP/money-whisperer-source.tgz"
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./.next-e2e' \
            --exclude='./.next-visual' \
            --exclude='./coverage' \
            --exclude='./playwright-report' \
            --exclude='./test-results' \
            -czf "$SOURCE_ARCHIVE" .
          SOURCE_ARCHIVE_SHA256="$(sha256sum "$SOURCE_ARCHIVE" | cut -d ' ' -f 1)"
          echo "SOURCE_ARCHIVE=$SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          echo "SOURCE_ARCHIVE_SHA256=$SOURCE_ARCHIVE_SHA256" >> "$GITHUB_ENV"
          echo "[deploy] Packaged source archive: $(stat -c '%s bytes' "$SOURCE_ARCHIVE")"

      - name: Upload deployment assets
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e scp -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$(command -v doppler)" \
            "$SOURCE_ARCHIVE" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Verify uploaded source
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEPLOY_PASSWORD"
          REMOTE_SOURCE_SHA256="$(
            sshpass -e ssh \
              -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=4 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "sha256sum /tmp/money-whisperer-source.tgz | cut -d ' ' -f 1"
          )"

          if [ "$REMOTE_SOURCE_SHA256" != "$SOURCE_ARCHIVE_SHA256" ]; then
            echo "Uploaded source archive checksum mismatch." >&2
            exit 1
          fi

          echo "[deploy] Source archive upload verified by SHA-256."

      - name: Prepare server
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail

          quote() {
            printf '%q' "$1"
          }

          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DOPPLER_TOKEN=$(quote "$DOPPLER_TOKEN") bash -s" <<'REMOTE'
          set -euo pipefail

          : "${DOPPLER_TOKEN:?}"
          export DOPPLER_TOKEN
          export DEBIAN_FRONTEND=noninteractive

          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          fi

          install_packages() {
            if command -v apt-get >/dev/null 2>&1; then
              . /etc/os-release
              for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
                [ -f "$source_file" ] || continue
                case "${ID:-}" in
                  debian)
                    $SUDO sed -i \
                      -e 's|http://deb.debian.org/debian-security|https://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
                      -e 's|https://deb.debian.org/debian-security|https://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
                      -e 's|http://security.debian.org/debian-security|https://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
                      -e 's|https://security.debian.org/debian-security|https://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
                      -e 's|http://deb.debian.org/debian|https://mirrors.tuna.tsinghua.edu.cn/debian|g' \
                      -e 's|https://deb.debian.org/debian|https://mirrors.tuna.tsinghua.edu.cn/debian|g' \
                      "$source_file"
                    ;;
                  ubuntu)
                    $SUDO sed -i \
                      -e 's|http://archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                      -e 's|https://archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                      -e 's|http://security.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                      -e 's|https://security.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                      -e 's|http://ports.ubuntu.com/ubuntu-ports|https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports|g' \
                      -e 's|https://ports.ubuntu.com/ubuntu-ports|https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports|g' \
                      "$source_file"
                    ;;
                esac
              done
              $SUDO apt-get update
              $SUDO apt-get install -y git curl ca-certificates docker.io docker-compose-plugin
            elif command -v dnf >/dev/null 2>&1; then
              $SUDO dnf install -y git curl ca-certificates docker docker-compose-plugin
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y git curl ca-certificates docker docker-compose-plugin
            else
              echo "Unsupported server OS: apt-get, dnf, or yum is required." >&2
              exit 1
            fi
          }

          echo "::group::Install server packages"
          if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            install_packages
          fi

          if command -v systemctl >/dev/null 2>&1; then
            $SUDO systemctl enable --now docker
          else
            $SUDO service docker start || true
          fi
          echo "::endgroup::"

          echo "::group::Install Doppler CLI"
          if ! command -v doppler >/dev/null 2>&1; then
            if [ -s /tmp/doppler ]; then
              $SUDO install -m 0755 /tmp/doppler /usr/local/bin/doppler
            fi
            if ! command -v doppler >/dev/null 2>&1 || ! doppler --version >/dev/null 2>&1; then
              curl --fail --location --show-error --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 180 \
                --tlsv1.2 --proto '=https' https://cli.doppler.com/install.sh | $SUDO sh
            fi
          fi
          doppler --version
          echo "::endgroup::"
          REMOTE

      - name: Build and restart containers
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail

          quote() {
            printf '%q' "$1"
          }

          REMOTE_ENV="DOPPLER_TOKEN=$(quote "$DOPPLER_TOKEN") DEPLOY_PATH=$(quote "$DEPLOY_PATH") DEPLOY_BRANCH=$(quote "$DEPLOY_BRANCH") GITHUB_REPOSITORY=$(quote "$GITHUB_REPOSITORY") GITHUB_SHA=$(quote "$GITHUB_SHA") DOPPLER_PROJECT=$(quote "$DOPPLER_PROJECT") DOPPLER_CONFIG=$(quote "$DOPPLER_CONFIG")"

          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_ENV bash -s" <<'REMOTE'
          set -euo pipefail

          : "${DOPPLER_TOKEN:?}"
          : "${DEPLOY_PATH:?}"
          : "${GITHUB_SHA:?}"
          : "${DOPPLER_PROJECT:?}"
          : "${DOPPLER_CONFIG:?}"

          export DOPPLER_TOKEN
          export GIT_SHA="$GITHUB_SHA"

          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          fi

          echo "::group::Unpack release"
          RELEASE_DIR="$DEPLOY_PATH/releases/$GITHUB_SHA"
          $SUDO rm -rf "$RELEASE_DIR"
          $SUDO mkdir -p "$RELEASE_DIR"
          $SUDO tar -xzf /tmp/money-whisperer-source.tgz -C "$RELEASE_DIR"
          $SUDO ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"
          cd "$DEPLOY_PATH/current"
          echo "::endgroup::"

          echo "[deploy] Starting Docker image build at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          build_heartbeat() {
            while sleep 20; do
              echo "[deploy] Docker image build is still running at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          }

          build_heartbeat &
          HEARTBEAT_PID=$!
          stop_heartbeat() {
            kill "$HEARTBEAT_PID" >/dev/null 2>&1 || true
            wait "$HEARTBEAT_PID" >/dev/null 2>&1 || true
          }
          trap stop_heartbeat EXIT

          doppler run \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            -- env BUILDKIT_PROGRESS=plain COMPOSE_PROGRESS=plain \
              stdbuf -oL -eL docker compose -p money-whisperer build money-whisperer

          stop_heartbeat
          trap - EXIT
          echo "[deploy] Docker image build completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "::group::Restart containers"
          doppler run \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            -- docker compose -p money-whisperer up -d --no-build --remove-orphans
          echo "::endgroup::"

          echo "::group::Deployment status"
          $SUDO docker image prune -f
          $SUDO docker compose -p money-whisperer ps
          echo "::endgroup::"
          REMOTE
